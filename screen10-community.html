<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traveloop – Community</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--primary:#1a3c5e;--accent:#e8a87c;--light:#f7f4ef;--white:#fff;--gray:#6b7280;--border:#e5e0d8;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--light);}
  nav{background:var(--primary);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;}
  nav .logo{color:var(--accent);font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;text-decoration:none;}
  nav a{color:#ccd6e0;text-decoration:none;font-size:.9rem;margin-left:20px;}
  nav a:hover{color:var(--accent);}
  .container{max-width:1100px;margin:0 auto;padding:36px 24px 60px;}
  h1{font-family:'Playfair Display',serif;font-size:2rem;color:var(--primary);margin-bottom:6px;}
  .subtitle{color:var(--gray);margin-bottom:28px;}
  .top-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
  .search-inp{flex:1;min-width:200px;padding:10px 16px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.93rem;}
  .search-inp:focus{outline:none;border-color:var(--accent);}
  .filter-chip{padding:8px 18px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);font-size:.86rem;cursor:pointer;transition:.2s;}
  .filter-chip.active,.filter-chip:hover{background:var(--primary);color:white;border-color:var(--primary);}
  .share-btn{background:var(--accent);color:white;border:none;border-radius:10px;padding:10px 22px;font-size:.9rem;font-weight:600;cursor:pointer;}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;}
  .community-card{background:var(--white);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:.2s;}
  .community-card:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(0,0,0,.1);}
  .card-cover{height:130px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;background:linear-gradient(135deg,#e8f5ff,#fff0e0);}
  .card-body{padding:18px 20px;}
  .card-user{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .card-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:white;font-weight:600;}
  .card-username{font-size:.82rem;color:var(--gray);}
  .card-name{font-family:'Playfair Display',serif;font-size:1rem;color:var(--primary);margin-bottom:4px;}
  .card-cities{font-size:.82rem;color:var(--gray);margin-bottom:10px;}
  .card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
  .card-tag{background:var(--light);padding:3px 10px;border-radius:10px;font-size:.74rem;color:var(--gray);}
  .card-footer{display:flex;align-items:center;justify-content:space-between;}
  .card-likes{font-size:.82rem;color:var(--gray);}
  .card-actions{display:flex;gap:8px;}
  .like-btn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.82rem;transition:.2s;}
  .like-btn:hover,.like-btn.liked{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;}
  .clone-btn{background:var(--accent);color:white;border:none;border-radius:8px;padding:5px 14px;font-size:.82rem;font-weight:600;cursor:pointer;}
  .share-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:100;}
  .share-modal.open{display:flex;}
  .modal-box{background:var(--white);border-radius:20px;padding:36px;width:min(500px,90vw);}
  .modal-box h2{font-family:'Playfair Display',serif;color:var(--primary);margin-bottom:18px;}
  .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  label{font-size:.85rem;font-weight:500;color:var(--primary);}
  input,select,textarea{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.93rem;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:18px;}
  .btn{padding:11px 22px;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;}
  .btn-accent{background:var(--accent);color:white;}
  .btn-outline{background:none;border:2px solid var(--primary);color:var(--primary);}
</style>
</head>
<body>
<nav>
  <a class="logo" href="screen3-dashboard.html">✈ Traveloop</a>
  <div>
    <a href="screen3-dashboard.html">Dashboard</a>
    <a href="screen6-my-trips.html">My Trips</a>
    <a href="screen8-explore.html">Explore</a>
    <a href="screen7-profile.html">Profile</a>
  </div>
</nav>

<div class="container">
  <h1>🌍 Community Itineraries</h1>
  <p class="subtitle">Discover travel plans shared by fellow explorers.</p>

  <div class="top-bar">
    <input class="search-inp" type="text" id="communitySearch" placeholder="Search destinations, travellers..." oninput="filterCommunity()">
    <button class="filter-chip active" onclick="setSort('popular',this)">🔥 Popular</button>
    <button class="filter-chip" onclick="setSort('recent',this)">🕐 Recent</button>
    <button class="filter-chip" onclick="setSort('budget',this)">💰 Budget-friendly</button>
    <button class="share-btn" onclick="openShareModal()">+ Share My Trip</button>
  </div>

  <div class="cards-grid" id="communityGrid"></div>
</div>

<!-- Share Modal -->
<div class="share-modal" id="shareModal">
  <div class="modal-box">
    <h2>Share Your Itinerary</h2>
    <div class="form-group">
      <label>Select Trip</label>
      <select id="shareTrip"></select>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" id="shareDesc" placeholder="Tell the community about this trip">
    </div>
    <div class="form-group">
      <label>Visibility</label>
      <select id="shareVis"><option>Public – everyone</option><option>Link only</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeShareModal()">Cancel</button>
      <button class="btn btn-accent" onclick="submitShare()">Share Now →</button>
    </div>
  </div>
</div>

<script>
  const communityTrips = [
    { id:1, user:'Arjun K', avatar:'A', title:'10 Days in Japan', cities:['Tokyo','Kyoto','Osaka'], emoji:'🗾', tags:['Culture','Food','City'], likes:124, budget:'Mid-range', days:10, date:'2025-05-01' },
    { id:2, user:'Priya M', avatar:'P', title:'Budget Europe Tour', cities:['Paris','Amsterdam','Prague'], emoji:'🌍', tags:['Budget','City','Culture'], likes:98, budget:'Budget', days:14, date:'2025-04-20' },
    { id:3, user:'Rahul S', avatar:'R', title:'Maldives Honeymoon', cities:['Malé','Maafushi'], emoji:'🐠', tags:['Beach','Luxury','Romance'], likes:210, budget:'Luxury', days:7, date:'2025-05-10' },
    { id:4, user:'Divya N', avatar:'D', title:'Solo Southeast Asia', cities:['Bangkok','Phuket','Bali'], emoji:'🌺', tags:['Solo','Beach','Adventure'], likes:156, budget:'Budget', days:21, date:'2025-03-15' },
    { id:5, user:'Karthik R', avatar:'K', title:'New York City Explorer', cities:['New York'], emoji:'🗽', tags:['City','Food','Culture'], likes:87, budget:'Mid-range', days:5, date:'2025-04-05' },
    { id:6, user:'Meera P', avatar:'M', title:'Rajasthan Royal Tour', cities:['Jaipur','Jodhpur','Udaipur'], emoji:'🏰', tags:['Culture','Heritage','Food'], likes:143, budget:'Budget', days:8, date:'2025-02-28' }
  ];

  let likedTrips = JSON.parse(localStorage.getItem('traveloop_liked') || '[]');
  let sortMode = 'popular';

  function renderCommunity(list) {
    const grid = document.getElementById('communityGrid');
    grid.innerHTML = list.map(trip => `
      <div class="community-card">
        <div class="card-cover">${trip.emoji}</div>
        <div class="card-body">
          <div class="card-user">
            <div class="card-avatar">${trip.avatar}</div>
            <span class="card-username">by ${trip.user}</span>
          </div>
          <div class="card-name">${trip.title}</div>
          <div class="card-cities">📍 ${trip.cities.join(' → ')} &nbsp;·&nbsp; ${trip.days} days</div>
          <div class="card-tags">${trip.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}<span class="card-tag">💰 ${trip.budget}</span></div>
          <div class="card-footer">
            <span class="card-likes">❤️ ${trip.likes} likes</span>
            <div class="card-actions">
              <button class="like-btn${likedTrips.includes(trip.id)?' liked':''}" onclick="toggleLike(${trip.id}, this)">${likedTrips.includes(trip.id)?'❤️':'🤍'} Like</button>
              <button class="clone-btn" onclick="cloneTrip(${trip.id})">Clone →</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function filterCommunity() {
    const q = document.getElementById('communitySearch').value.toLowerCase();
    let list = [...communityTrips];
    if (q) list = list.filter(t => t.title.toLowerCase().includes(q) || t.user.toLowerCase().includes(q) || t.cities.some(c => c.toLowerCase().includes(q)));
    if (sortMode === 'popular') list.sort((a,b) => b.likes - a.likes);
    else if (sortMode === 'recent') list.sort((a,b) => new Date(b.date) - new Date(a.date));
    else if (sortMode === 'budget') list.sort((a,b) => (a.budget === 'Budget' ? -1 : 1));
    renderCommunity(list);
  }

  function setSort(mode, el) {
    sortMode = mode;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    filterCommunity();
  }

  function toggleLike(id, btn) {
    const idx = likedTrips.indexOf(id);
    if (idx === -1) { likedTrips.push(id); btn.classList.add('liked'); btn.textContent = '❤️ Like'; }
    else { likedTrips.splice(idx, 1); btn.classList.remove('liked'); btn.textContent = '🤍 Like'; }
    localStorage.setItem('traveloop_liked', JSON.stringify(likedTrips));
  }

  function cloneTrip(id) {
    const trip = communityTrips.find(t => t.id === id);
    const newTrip = { id: Date.now(), name: trip.title + ' (Cloned)', type: 'Solo Adventure', startDate: '', endDate: '', cities: trip.cities.map(c => ({city: c, country: '', arrival: '', departure: '', budget: 0})), tags: trip.tags, totalBudget: 0, status: 'draft' };
    const trips = JSON.parse(localStorage.getItem('traveloop_trips') || '[]');
    trips.push(newTrip);
    localStorage.setItem('traveloop_trips', JSON.stringify(trips));
    localStorage.setItem('traveloop_current_trip', JSON.stringify(newTrip));
    alert(`"${trip.title}" cloned to your trips!`);
    window.location.href = 'screen6-my-trips.html';
  }

  function openShareModal() {
    const trips = JSON.parse(localStorage.getItem('traveloop_trips') || '[]');
    const sel = document.getElementById('shareTrip');
    sel.innerHTML = trips.length ? trips.map(t => `<option value="${t.id}">${t.name}</option>`).join('') : '<option>No trips yet</option>';
    document.getElementById('shareModal').classList.add('open');
  }

  function closeShareModal() {
    document.getElementById('shareModal').classList.remove('open');
  }

  function submitShare() {
    alert('Your itinerary has been shared with the community!');
    closeShareModal();
  }

  filterCommunity();
</script>
</body>
</html>
